<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgendaYa - Cartagena</title>
<style>
body{font-family:Arial;background:#f0f4ff;margin:0}header{background:#4a80ff;color:#fff;padding:20px;text-align:center} .card{background:#fff;max-width:500px;margin:30px auto;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.1)} input,select{width:100%;padding:12px;margin:8px 0 12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box} .horas{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0} .hora-btn{padding:8px 12px;border:1px solid #4a80ff;border-radius:6px;cursor:pointer;background:#fff} .hora-btn.activa{background:#4a80ff;color:#fff} .btn-principal{background:#4a80ff;color:#fff;border:none;padding:14px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer} #error-wpp{color:red;font-size:13px;display:none} #confirmacion{display:none;text-align:center}
</style>
</head>
<body>
<header><h1>AgendaYa</h1><p>Tu tiempo, en buenas manos</p><small>Reserva tu corte en segundos - Cartagena</small></header>
<div class="card" id="formulario">
<label>Servicio</label>
<select id="servicio"><option value="">Selecciona un servicio</option><option>Corte Clásico - $18.000</option><option>Barba - $12.000</option><option>Corte + Barba - $25.000</option></select>
<label>Fecha</label><input type="date" id="fecha">
<label>Hora disponible</label><div id="contenedor-horas" class="horas"></div>
<label>Tu nombre</label><input type="text" id="nombre" placeholder="Ej: Faneth Mejia">
<label>WhatsApp</label><input type="text" id="whatsapp" placeholder="Ej: 3001234567"><div id="error-wpp">Debe tener 10 números y empezar por 3</div>
<button class="btn-principal" onclick="agendar()">Agendar por WhatsApp</button>
</div>
<div class="card" id="confirmacion"><h2>¡Listo! ✅</h2><p id="resumen"></p><p>Te redirigimos a WhatsApp en 3 segundos...</p></div>
<footer style="text-align:center;padding:10px;color:#555"><b>Faneth Mejia Diaz</b><br><small>Proyecto productivo SENA - ADSO</small></footer>
<script>
const fechaInput=document.getElementById('fecha');
const contHoras=document.getElementById('contenedor-horas');
const hoy=new Date().toISOString().split('T')[0]; fechaInput.min=hoy;
function generarHoras(){
  contHoras.innerHTML='';
  ["08:00","09:00","10:00","11:00","14:00","15:00","16:00","17:00"].forEach(h=>{
    const b=document.createElement('button');
    b.textContent=h; b.type='button'; b.className='hora-btn';
    b.onclick=()=>{document.querySelectorAll('.hora-btn').forEach(x=>x.classList.remove('activa')); b.classList.add('activa')};
    contHoras.appendChild(b);
  });
}
fechaInput.addEventListener('change',generarHoras); generarHoras();
function validarWPP(){
  const wpp=document.getElementById('whatsapp').value.trim();
  const err=document.getElementById('error-wpp');
 const ok=/^3\d{9}$/.test(wpp);
  err.style.display=ok?'none':'block';
  return ok;
}
document.getElementById('whatsapp').addEventListener('input',validarWPP);
async function agendar(){
  const servicio=document.getElementById('servicio').value;
  const fecha=fechaInput.value;
  const horaBtn=document.querySelector('.hora-btn.active');
  const nombre=document.getElementById('nombre').value.trim();
  const wpp=document.getElementById('whatsapp').value.trim();
  if(!servicio||!fecha||!horaBtn||!nombre){ alert('Completa todos los campos y selecciona hora'); return; }
  if(!validarWPP()) return;
  const hora=horaBtn.textContent;

  const res=await fetch('/api/agendar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fecha,hora,nombre,wpp,servicio})});
  const data=await res.json();
  if(!res.ok){ alert(data.error); return; }

  document.getElementById('formulario').style.display='none';
  document.getElementById('confirmacion').style.display='block';
  document.getElementById('resumen').innerHTML=`<b>Servicio:</b> ${servicio}<br><b>Fecha:</b> ${fecha}<br><b>Hora:</b> ${hora}`;
  const msg=`Hola AgendYa! Quiero agendar: ${servicio} el ${fecha} a las ${hora}. Soy ${nombre}`;
  const url=`https://wa.me/573001234567?text=${encodeURIComponent(msg)}`;
  setTimeout(()=>window.open(url,'_blank'),3500);
}
</script>
</body>
</html>
